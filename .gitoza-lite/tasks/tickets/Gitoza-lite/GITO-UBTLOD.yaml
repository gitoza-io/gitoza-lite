## Summary

Drop the Save button and persist edits automatically after a short pause.

## Details

- Editors: ticket, wiki, release, and run.
- Debounce **2s** after the last change, then write to disk.
- Keep leave-guards for dirty runs; surface write errors without blocking the UI.

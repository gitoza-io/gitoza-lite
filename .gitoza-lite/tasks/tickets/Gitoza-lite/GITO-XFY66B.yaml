## Summary

On Releases, project list and project focus show three release-status quick filters (open / shipped / cancelled) with no search. After opening a release, the toolbar switches to ticket-status filters plus search under the existing rocket sticky header.

## Details

- Exclusive highlight toggles only (no under-bar status badge); click again clears.
- Create project stays on project list only; search appears only in release focus.
- Clear release-status filter when entering a release; clear ticket filter and search when leaving release focus.

## Summary

Single search input for developers: type `status: open` and Enter to add a removable filter badge; Tab autocompletes keys and enum values.

## Details

- No multi-row SearchPanel or priority-only dropdown.
- Free text without `:` becomes a `q` chip; chips AND together.
- Surfaces: Tickets, Releases, Wiki, Test Repository.

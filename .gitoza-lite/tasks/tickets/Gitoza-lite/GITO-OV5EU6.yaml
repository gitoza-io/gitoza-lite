## Summary

Icons and UI chrome should stay clear and readable in dark mode and across different VS Code color themes.

## Details

- Audit icons, labels, borders, and surfaces under dark mode and common VS Code themes (light, dark, high contrast).
- Prefer theme tokens / CSS variables so contrast stays consistent when the theme changes.
- Fix any low-contrast icons, muted text, or hard-coded colors that break readability in dark or alternate themes.

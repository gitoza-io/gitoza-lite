## Summary

In ticket view mode, scrolling moves frontmatter with the body. Only the title and ticket ID stay pinned at the top (same sticky split as edit mode).

## Details

- Frontmatter chips scroll away with the markdown body (one scrollbar).
- Title and ticket ID remain visible at the top while scrolling.
- Matches edit-mode StickyThenScroll behavior for the header/metadata split.

## Summary

Let users pin frequently used ticket projects so they stay at the top of the list.

## Details

- On project-row hover, show a pin icon before the count badge.
- Toggle pin/unpin; pinned projects sort to the top (A–Z among pinned).
- Persist in `localStorage`; shared by Tickets and Releases.

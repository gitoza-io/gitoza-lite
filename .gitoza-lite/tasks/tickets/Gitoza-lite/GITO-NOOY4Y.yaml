## Summary

GitTestLens-style tree navigation: chevron expands, click selects, double-click enters a root.

## Details

- `>` expands/collapses only; single-click selects only.
- Double-click a project or run to hide siblings; chevron becomes a back arrow.
- Releases: enter project, then release; back steps out one level.
- Applies to Tickets, Releases, Test Repository, and Test Run.

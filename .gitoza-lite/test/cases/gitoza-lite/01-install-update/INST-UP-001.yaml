## Description

Verify the extension installs, activates, and exposes the main sidebar navigation.

## Page object

- **Activity Bar icon** — Gitoza Lite entry in the VS Code Activity Bar
- **Sidebar rail** — left icon rail inside the extension webview
- **Nav.Tickets** — Tickets icon (`aria-label: Tickets`)
- **Nav.Releases** — Releases icon (`aria-label: Releases`)
- **Nav.Wiki** — Wiki icon (`aria-label: Wiki`)
- **Nav.TestRepository** — Test Repository icon (`aria-label: Test Repository`)
- **Nav.TestRun** — Test Run icon (`aria-label: Test Run`)

## Steps

1. Install or reload the Gitoza Lite extension in VS Code.
2. Click **Activity Bar icon** to open the extension.
3. Confirm **Sidebar rail** shows **Nav.Tickets**, **Nav.Releases**, **Nav.Wiki**, **Nav.TestRepository**, and **Nav.TestRun**.
4. Click each nav icon once and confirm the corresponding view loads without error.

## Expected results

- Extension activates without errors in the developer console.
- All five sidebar nav icons are visible and switch views correctly.


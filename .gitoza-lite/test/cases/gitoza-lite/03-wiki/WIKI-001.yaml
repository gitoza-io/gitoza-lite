## Description

Verify the Wiki view can create or open a page, edit Markdown content, and persist changes.

## Page object

- **Nav.Wiki** — sidebar Wiki icon
- **Wiki.Tree** — wiki folder / page tree
- **Wiki.Detail** — page editor (title, tags, status, Markdown body)
- **Wiki.TitleField** — page title input
- **Wiki.BodyEditor** — Markdown body editor
- **Wiki.SaveControl** — save action (button or auto-save indicator)

## Steps

1. Click **Nav.Wiki**.
2. In **Wiki.Tree**, create a new page or open an existing one.
3. In **Wiki.Detail**, update **Wiki.TitleField**.
4. Edit content in **Wiki.BodyEditor**.
5. Persist via **Wiki.SaveControl** (or wait for auto-save if enabled).
6. Leave and reopen the same page.

## Expected results

- Wiki page loads and edits without error.
- Title and body changes remain after reopen.
- Page file exists under `.gitoza-lite/wiki/`.

